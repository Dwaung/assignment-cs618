name: Deploy Blog Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.url }}
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Build and Push Backend Docker Image
        run: |
          docker build --platform linux/amd64 -t hergin/blog-backend ./backend
          docker push hergin/blog-backend
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy blog-backend \
            --image hergin/blog-backend \
            --platform managed \
            --region ${{ secrets.GOOGLECLOUD_REGION }} \
            --allow-unauthenticated
      - name: Get Backend URL
        id: get-backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe blog-backend --platform managed --region ${{ secrets.GOOGLECLOUD_REGION }} --format 'value(status.url)')
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
      - name: Build and Push Frontend Docker Image
        run: |
          docker build --platform linux/amd64 --build-arg "VITE_BACKEND_URL=${{ steps.get-backend-url.outputs.backend_url }}/api/v1" -t hergin/blog-frontend ./frontend
          docker push hergin/blog-frontend
      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        run: |
          gcloud run deploy blog-frontend \
            --image hergin/blog-frontend \
            --platform managed \
            --region ${{ secrets.GOOGLECLOUD_REGION }} \
            --allow-unauthenticated